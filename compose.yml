services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: stl
      POSTGRES_DB: stl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Headless PrusaSlicer wrapped in a small HTTP service (./slicer). Slices
  # unsliced .3mf uploads to estimate print time & filament use. The port is
  # published so `npm run dev` on the host can reach it too.
  slicer:
    build: ./slicer
    restart: unless-stopped
    ports:
      - "8000:8000"

  # Full self-hosted deployment: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://stl:stl@postgres:5432/stl
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Optional OIDC SSO (see .env.example)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      # Point these at your S3-compatible storage (AWS S3, MinIO, Garage, …)
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to your S3-compatible storage}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-models}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Headless slicer service for print time / filament estimates
      SLICER_URL: http://slicer:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
