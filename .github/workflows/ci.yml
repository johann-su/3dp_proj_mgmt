name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests: src/**/*.test.ts + slicer/*.test.mjs (no DB/network needed).
      - run: npm test

      - run: npx tsc --noEmit
