name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests: src/**/*.test.ts + slicer/*.test.mjs (no DB/network needed).
      - run: npm test

      # The OrcaSlicer plugin's project merge (orca-plugin/) is pure logic over
      # 3MF archives, and Python, so it has no runner in `npm test`. Stdlib
      # only — no slicer and no instance involved.
      - run: python3 orca-plugin/assemble.test.py

      - run: npx tsc --noEmit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextra/package-lock.json

      - run: npm ci
        working-directory: nextra

      # Nextra docs site is a separate Next.js app/package (its own version,
      # own lockfile); build it standalone rather than folding into the root
      # checks. Static export catches broken MDX/links before they ship.
      - run: npm run build
        working-directory: nextra
