# Generic FFF baseline for estimation slicing (0.4 mm nozzle, 0.2 mm layers,
# PLA). Settings embedded in the uploaded .3mf (Bambu/Orca
# project_settings.config or PrusaSlicer Slic3r_PE.config) are translated into
# a derived config that overrides these values — see deriveConfig in
# server.mjs. Keys not listed anywhere fall back to PrusaSlicer's built-in
# defaults.
#
# ESTIMATION-BED: the bed is a deliberately huge virtual plate and is never
# taken from the file. Bambu multi-plate projects place objects in world
# coordinates far outside the physical bed (plate 2 starts around x=500), and
# bed size has no meaningful effect on time/material estimates — a real-size
# bed would just fail perfectly printable multi-plate files. Skirts stay off
# so a skirt can't be drawn around the whole spread-out build.

# printer
bed_shape = 0x0,2000x0,2000x2000,0x2000
max_print_height = 1200
nozzle_diameter = 0.4
gcode_flavor = marlin

# print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
skirts = 0
brim_width = 0
support_material = 0

# filament (density feeds the [g] estimate in the gcode footer)
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
