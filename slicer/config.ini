# Generic FFF profile used for estimation slicing (0.4 mm nozzle, 0.2 mm
# layers, PLA). Uploaded .3mf files rarely carry PrusaSlicer-readable print
# settings (Bambu Studio / OrcaSlicer store theirs in Metadata/*.config, which
# PrusaSlicer ignores), so estimates are computed against this one profile and
# are approximations by design. Keys not listed fall back to PrusaSlicer's
# built-in defaults.

# printer
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
gcode_flavor = marlin

# print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
skirts = 1
brim_width = 0
support_material = 0

# filament (density feeds the [g] estimate in the gcode footer)
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
